<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciamento de Clientes</title>
  <link rel="stylesheet" href="clientes.css">
</head>
<body>
  <div class="header">
    <h2>Gerenciamento de Clientes</h2>
    <a href="painel.html" class="btn btn-secondary">Voltar ao Painel</a>
  </div>

  <div class="card">
    <h3>Novo Cliente</h3>
    <form id="formCliente">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" required placeholder="Ex: Carlos Eduardo">
      </div>
      <div class="form-group">
        <label for="cpf">CPF (Armazenamento Seguro / LGPD)</label>
        <input type="text" id="cpf" required placeholder="000.000.000-00">
      </div>
      <div class="form-group">
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" required placeholder="(48) 99999-8888">
      </div>
      <button type="submit" class="btn btn-success">Cadastrar Cliente</button>
    </form>
  </div>

  <div class="card">
    <h3>Listagem de Clientes</h3>
    <div class="search-box">
      <input type="text" id="campoBusca" placeholder="Digite um termo para buscar por nome ou telefone...">
      <button id="btnBuscar" class="btn btn-primary">Buscar</button>
      <button id="btnLimpar" class="btn btn-secondary">Limpar</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Telefone</th>
        </tr>
      </thead>
      <tbody id="tabelaClientes">
        <tr><td colspan="3">A carregar clientes...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="clientes.js"></script>
</body>
</html>
